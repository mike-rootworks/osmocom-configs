! Passwordless SMPP section included in this repository's osmo-msc.cfg.
! For another MSC config, add this section once and restart OsmoMSC.
! Replace 10.0.0.251 with the MSC server's LAN IP if it differs.
smpp
 local-tcp-ip 10.0.0.251 2775
 system-id GSMLab
 policy closed
 no smpp-first
 esme sms-client
  no password
  no alert-notifications

! Append this section to your active osmo-msc.cfg, then restart OsmoMSC.
! Replace CHANGEME with your chosen password (1-8 ASCII characters).
! Use the same password in the sender's SMPP_PASSWORD environment variable.
smpp
 local-tcp-ip 127.0.0.1 2775
 system-id GSMLab
 policy closed
 no smpp-first
 esme sms-client
  password CHANGEME
  no alert-notifications

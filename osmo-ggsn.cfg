log stderr
 logging filter all 1
 logging color 0
 logging timestamp 1
 logging print category 1
 logging print level 1
 logging level set-all notice
!
line vty
 bind 127.0.0.1
 no login
!
ctrl
 bind 127.0.0.1
!
stats interval 5
ggsn ggsn0
 gtp state-dir /var/lib/osmocom-lab/ggsn
 gtp bind-ip 127.0.0.2
 apn internet
  gtpu-mode tun
  tun-device tun-osmo
  type-support v4
  mtu 1420 apply
  ip prefix dynamic 172.16.23.0/24
  ip dns 0 1.1.1.1
  ip dns 1 8.8.8.8
  ip ifconfig 172.16.23.0/24
  no shutdown
 default-apn internet
 no shutdown ggsn
